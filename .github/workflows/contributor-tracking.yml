name: contributor Training
on:
  push:
    branches:
      - main
  pull_request:
    types: [closed]
    branches:
      - main
permissions:
  contents: write
  pull-requests: read

concurrency:
  group: contributor-traking-main
  cancel-in-progress: false

jobs:
  update-contributor:
    if: github.event_name != 'pull_request' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          ref: main

      - name: Update contributors
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: python scripts/update_contributors.py
      - name: Commit updated records
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md data/contributor-log.json

          if ! git diff --cached --quiet; then
            git commit -m "docs: update contributor tracking"
            git push origin HEAD:main
          else
            echo "No contributor changes detected."
          fi
